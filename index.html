<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday! 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1b3d;--bg2:#4a2c5e;--pink:#ff8fb1;--peach:#ffd3b6;--cream:#fff6ef;--flame:#ffc83d}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--cream);background:radial-gradient(circle at 50% 10%,var(--bg2),var(--bg) 75%) fixed;min-height:100vh;overflow-x:hidden;text-align:center}
section{min-height:100vh;padding:48px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1,h2{font-family:'Fraunces',serif;font-weight:600;line-height:1.15}
h1{font-size:clamp(2rem,8vw,3.6rem)} h2{font-size:clamp(1.6rem,6vw,2.4rem);margin-bottom:22px}
.sub{margin-top:10px;opacity:.85}
button{font:inherit;font-weight:600;color:var(--bg);background:var(--peach);border:0;padding:12px 26px;border-radius:999px;cursor:pointer;margin:6px}
button:hover{background:var(--cream)}
button.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(255,246,239,.5)}
:focus-visible{outline:3px solid var(--flame);outline-offset:3px}
.hidden{display:none!important}
#balloons{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.b{position:absolute;bottom:-120px;width:44px;height:56px;border-radius:50% 50% 48% 48%;opacity:.55;animation:up linear infinite}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:40px;background:rgba(255,246,239,.4)}
@keyframes up{to{transform:translateY(-120vh) translateX(30px)}}
section,#musik{position:relative;z-index:1}
/* gate */
#cd{display:flex;gap:12px;margin-top:22px;justify-content:center}
#cd div{background:rgba(255,246,239,.1);border-radius:12px;padding:12px 14px;min-width:64px}
#cd b{display:block;font-family:'Fraunces',serif;font-size:1.8rem}
/* cake */
.cake{position:relative;width:220px;margin:52px auto 24px;cursor:pointer}
.candle{position:absolute;top:-46px;width:8px;height:34px;background:linear-gradient(var(--peach),var(--pink));border-radius:3px}
.candle:nth-child(1){left:62px}.candle:nth-child(2){left:106px}.candle:nth-child(3){left:150px}
.flame{position:absolute;top:-22px;left:50%;width:14px;height:22px;transform:translateX(-50%);background:radial-gradient(circle at 50% 70%,#fff 10%,var(--flame) 50%,#ff7a3d);border-radius:50%/60% 60% 40% 40%;animation:fl .5s infinite alternate}
.candle{cursor:pointer}
.candle::before{content:"";position:absolute;inset:-34px -20px -4px}
.candle.off .flame{display:none}
.candle.off::after{content:"";position:absolute;top:-16px;left:2px;width:4px;height:14px;background:rgba(255,255,255,.35);border-radius:4px;animation:smoke 1.6s ease-out forwards}
@keyframes smoke{to{transform:translateY(-30px);opacity:0}}
@keyframes fl{from{transform:translateX(-50%) rotate(-3deg)}to{transform:translateX(-50%) scale(.9,1.12) rotate(3deg)}}
.tier{height:54px;border-radius:14px;position:relative}
.t1{width:150px;margin:0 auto;background:var(--pink)}.t2{width:220px;margin-top:-6px;background:var(--peach)}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;border-radius:14px 14px 40% 40%;background:var(--cream)}
/* timeline */
.tl{max-width:560px;width:100%;display:flex;flex-direction:column;gap:46px}
.ph{background:rgba(255,246,239,.08);border-radius:10px;padding:10px 10px 14px}
.ph .img{aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:rgba(255,246,239,.12);display:flex;align-items:center;justify-content:center;font-size:.85rem;opacity:.9;border:1.5px dashed rgba(255,246,239,.35)}
.ph .img.ok{border:0}
.ph img{width:100%;height:100%;object-fit:cover}
.ph p{margin-top:10px;font-style:italic}
.ph:nth-child(odd){transform:rotate(-1.5deg)}.ph:nth-child(even){transform:rotate(1.5deg)}
.rv{opacity:0;transform:translateY(30px);transition:.7s}.rv.in{opacity:1;transform:none}
.ph.rv.in:nth-child(odd){transform:rotate(-1.5deg)}.ph.rv.in:nth-child(even){transform:rotate(1.5deg)}
/* gifts */
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:420px;width:100%}
.gift{aspect-ratio:1;font-size:2.6rem;background:rgba(255,246,239,.1);border:1.5px solid rgba(255,246,239,.25);border-radius:14px;color:inherit;margin:0;padding:0}
.gift:hover{background:rgba(255,246,239,.2)}
.gift.open{background:var(--cream);font-size:1.6rem}
#modal{position:fixed;inset:0;background:rgba(20,10,30,.75);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
#modal div{background:var(--cream);color:#3b2a45;border-radius:10px;padding:28px 24px;max-width:380px;line-height:1.7}
/* letter */
.letter{max-width:520px;padding:28px 26px;text-align:left;background:var(--cream);color:#3b2a45;border-radius:6px;line-height:1.75;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.letter h3{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:1.5rem;margin-bottom:10px}
.letter p{white-space:pre-line;min-height:9em}
#musik{position:fixed;top:14px;right:14px;z-index:15;padding:8px 14px;font-size:.9rem}
/* efek buram saat musik nyala */
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.5s;filter:blur(70px)}
#glow i{position:absolute;width:45vmax;height:45vmax;border-radius:50%;animation:drift 14s ease-in-out infinite alternate}
#glow i:nth-child(1){background:#ff8fb1;left:-12%;top:-10%}
#glow i:nth-child(2){background:#b79cff;right:-15%;top:30%;animation-delay:-5s}
#glow i:nth-child(3){background:#ffc83d;left:15%;bottom:-20%;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.15)}}
#balloons{transition:filter 1.5s,opacity 1.5s}
body.playing #glow{opacity:.45} /* naikkan angka ini untuk lebih terang */
body.playing #balloons{filter:blur(3px);opacity:.8}
canvas{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="balloons"></div>
<div id="glow"><i></i><i></i><i></i></div>
<button id="musik" class="ghost">🎵 Musik</button>

<!-- 1. GATE (hitung mundur) -->
<section id="gate" class="hidden">
  <h1>Sabar ya, <span class="nm">Pinka</span> 🤫</h1>
  <p class="sub">Kejutannya terbuka sebentar lagi...</p>
  <div id="cd"></div>
</section>

<!-- 2. KUE -->
<section id="s1">
  <h1>Happy Birthday, <span class="nm">Pinka</span>! 🎉</h1>
  <p class="sub" id="sub">Klik lilinnya satu per satu ya!</p>
  <div class="cake" id="cake">
    <div class="candle" role="button" tabindex="0" aria-label="Padamkan lilin 1"><div class="flame"></div></div>
    <div class="candle" role="button" tabindex="0" aria-label="Padamkan lilin 2"><div class="flame"></div></div>
    <div class="candle" role="button" tabindex="0" aria-label="Padamkan lilin 3"><div class="flame"></div></div>
    <div class="tier t1"></div><div class="tier t2"></div>
  </div>
  <div><button id="mic" class="ghost">Tiup pakai mic 🎤</button></div>
</section>

<div id="after" class="hidden">
  <!-- 3. TIMELINE FOTO -->
  <section id="s2"><h2>Perjalanan kita 📸</h2><div class="tl" id="tl"></div></section>
  <!-- 4. HADIAH -->
  <section id="s3"><h2>Buka hadiahnya 🎁</h2><div class="gifts" id="gifts"></div><p class="sub">Klik satu per satu ya</p></section>
  <!-- 5. SURAT -->
  <section id="s4"><div class="letter"><h3 id="salam"></h3><p id="isi"></p></div><button id="lagi" style="margin-top:28px">Rayakan lagi 🎊</button></section>
</div>

<div id="modal" class="hidden"><div><p id="mt"></p><button id="mx" style="margin-top:16px">Tutup</button></div></div>
<audio id="audio" loop src="lagu.mp3"></audio>
<canvas id="cf"></canvas>

<script>
/* ============ EDIT BAGIAN INI ============ */
const NAMA = "Pinka";
const PENGIRIM = "Aku";
// Hitung mundur: isi "2026-12-31T00:00:00" (waktu HP dia), atau null kalau tidak mau
const TARGET = null;

// FOTO: taruh file di folder "foto/" lalu samakan nama file-nya. Tambah/kurangi baris sesuka hati.
const FOTO = [
  {src:"foto/1.jpg", cap:"Pertama kali kita kenal 😆"},
  {src:"foto/2.jpg", cap:"Momen random yang paling seru"},
  {src:"foto/3.jpg", cap:"Hari itu kita ketawa terus"},
  {src:"foto/4.jpg", cap:"Foto favoritku bareng kamu"},
];

// HADIAH: 6 kotak, isi pesan masing-masing
const HADIAH = [
  "Semoga panjang umur dan sehat selalu 🌿",
  "Semoga semua mimpimu tahun ini jadi nyata ✨",
  "Semoga selalu dikelilingi orang yang sayang sama kamu 🤍",
  "Semoga rezekinya lancar dan hatinya tenang 🍀",
  "Makasih udah jadi teman yang baik 🫶",
  "Traktir aku ya, kan kamu yang ultah 😝",
];

const PESAN = `Selamat ulang tahun! Semoga hari ini penuh tawa dan hal-hal manis.

Makasih sudah jadi teman yang selalu ada, yang bikin hari-hari biasa jadi seru. Semoga tahun ini jadi tahun terbaikmu.

Jangan lupa makan kuenya ya! 🎂`;
/* ========================================= */

const $ = id => document.getElementById(id);
document.title = `Happy Birthday, ${NAMA}! 🎂`;
document.querySelectorAll('.nm').forEach(e => e.textContent = NAMA);
$('salam').textContent = `Untuk ${NAMA},`;

/* Balon latar */
const wr = $('balloons'), warna = ['#ff8fb1','#ffd3b6','#ffc83d','#b79cff','#8fd3ff'];
for (let i=0;i<14;i++){
  const b = document.createElement('div'); b.className='b';
  b.style.cssText = `left:${Math.random()*95}%;background:${warna[i%5]};animation-duration:${10+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;
  wr.appendChild(b);
}

/* Gate hitung mundur */
function gate(){
  const t = TARGET && new Date(TARGET).getTime();
  if (!t || Date.now() >= t) return;
  $('gate').classList.remove('hidden'); $('s1').classList.add('hidden');
  const tick = () => {
    const d = t - Date.now();
    if (d <= 0){ $('gate').classList.add('hidden'); $('s1').classList.remove('hidden'); return; }
    const v = [[d/864e5,'hari'],[d/36e5%24,'jam'],[d/6e4%60,'menit'],[d/1e3%60,'detik']];
    $('cd').innerHTML = v.map(x=>`<div><b>${Math.floor(x[0])}</b>${x[1]}</div>`).join('');
    setTimeout(tick,1000);
  };
  tick();
}
gate();

/* Timeline */
FOTO.forEach(f => {
  const d = document.createElement('div'); d.className='ph rv';
  d.innerHTML = `<div class="img">Taruh foto di<br>${f.src}</div><p>${f.cap}</p>`;
  const im = new Image(); im.alt = f.cap;
  im.onload = () => { const box = d.querySelector('.img'); box.className='img ok'; box.innerHTML=''; box.appendChild(im); };
  im.src = f.src;
  $('tl').appendChild(d);
});

/* Hadiah */
HADIAH.forEach((m,i) => {
  const b = document.createElement('button'); b.className='gift'; b.textContent='🎁'; b.setAttribute('aria-label',`Hadiah ${i+1}`);
  b.onclick = () => { b.classList.add('open'); b.textContent='💌'; $('mt').textContent=m; $('modal').classList.remove('hidden'); boom(40); };
  $('gifts').appendChild(b);
});
$('mx').onclick = () => $('modal').classList.add('hidden');

/* Reveal saat scroll */
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), {threshold:.2});
document.querySelectorAll('.rv').forEach(e => io.observe(e));

/* Tiup lilin */
let done = false;
function tiup(){
  if (done) return; done = true;
    $('sub').textContent = 'Semoga wishmu terkabul! ✨';
  boom(160);
  setTimeout(() => { $('after').classList.remove('hidden'); $('s2').scrollIntoView({behavior:'smooth'}); }, 1000);
}
const candles = [...document.querySelectorAll('.candle')];
function padam(c){
  if (done || c.classList.contains('off')) return;
  c.classList.add('off'); boom(18);
  const sisa = candles.filter(x => !x.classList.contains('off')).length;
  if (sisa) $('sub').textContent = `Tinggal ${sisa} lilin lagi... 🕯️`; else tiup();
}
candles.forEach(c => {
  c.onclick = () => padam(c);
  c.onkeydown = e => (e.key==='Enter'||e.key===' ') && padam(c);
});
$('mic').onclick = async () => {
  try {
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    const ac = new (window.AudioContext||window.webkitAudioContext)(), an = ac.createAnalyser();
    ac.createMediaStreamSource(st).connect(an); const buf = new Uint8Array(an.fftSize);
    $('sub').textContent = 'Tiup ke mic HP-mu... 💨';
    (function cek(){
      an.getByteTimeDomainData(buf);
      let m = 0; buf.forEach(v => m = Math.max(m, Math.abs(v-128)));
      if (m > 70){ st.getTracks().forEach(t=>t.stop()); candles.forEach(c=>c.classList.add('off')); tiup(); } else if(!done) requestAnimationFrame(cek);
    })();
  } catch(e){ $('sub').textContent = 'Mic tidak bisa diakses, klik kuenya aja ya 🙂'; }
};

/* Surat (ketik saat terlihat) */
let typed = false;
new IntersectionObserver((es,o) => es.forEach(e => {
  if (e.isIntersecting && !typed){
    typed = true; const t = PESAN + `\n\n— ${PENGIRIM}`; let i = 0;
    (function s(){ $('isi').textContent = t.slice(0,++i); if (i<t.length) setTimeout(s,28); else boom(120); })();
  }
}), {threshold:.6}).observe($('s4'));
$('lagi').onclick = () => boom(200);

/* Musik */
$('musik').onclick = function(){
  if (audio.paused){ audio.play().catch(()=>{}); this.textContent='⏸️ Jeda'; } else { audio.pause(); this.textContent='🎵 Musik'; }
};
const audio = $('audio');
audio.addEventListener('play',()=>document.body.classList.add('playing'));
audio.addEventListener('pause',()=>document.body.classList.remove('playing'));

/* Confetti */
const cv = $('cf'), cx = cv.getContext('2d'); let ps = [], run = false;
const rs = () => { cv.width = innerWidth; cv.height = innerHeight; }; addEventListener('resize', rs); rs();
function boom(n){
  for (let i=0;i<n;i++) ps.push({x:innerWidth/2,y:innerHeight*.5,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,s:Math.random()*7+4,c:warna[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.3});
  if (!run){ run = true; loop(); }
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(p => { p.vy+=.25; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); });
  ps = ps.filter(p => p.y < cv.height+20);
  if (ps.length) requestAnimationFrame(loop); else { run = false; cx.clearRect(0,0,cv.width,cv.height); }
}
</script>
</body>
</html>
